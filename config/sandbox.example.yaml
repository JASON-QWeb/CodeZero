sandbox:
  mode: docker
  image: agent-sandbox-node:latest
  root_dir: "./sandboxes"
  network:
    allow:
      - github.com
      - api.openai.com
      - registry.npmjs.org
  filesystem:
    allow_repo_only: true
  limits:
    max_runtime_minutes: 90
    max_diff_files: 30
    max_diff_lines: 1200
    max_quality_gate_retries: 6
  implementation_executor:
    # Internal CodeZero coding executor. The default command uses OpenCode
    # inside the isolated sandbox, but user-facing PRs and comments still
    # present this as CodeZero implementation work.
    mode: cli
    name: codezero-coding-cli
    command: 'npx -y opencode-ai@latest run --agent build --model "$CODEZERO_OPENCODE_MODEL" --format json --dangerously-skip-permissions "Implement the CodeZero request in the attached prompt file." --file="$CODEZERO_PROMPT_FILE"'
    timeout_ms: 3600000
    env: {}
