sandbox:
  mode: docker
  image: agent-sandbox-node:latest
  root_dir: "./sandboxes"
  network:
    allow:
      - github.com
      - api.openai.com
      - registry.npmjs.org
  filesystem:
    allow_repo_only: true
  limits:
    max_runtime_minutes: 90
    max_diff_files: 30
    max_diff_lines: 1200
    max_quality_gate_retries: 6
  implementation_executor:
    # Internal CodeZero coding executor. Install OpenCode on PATH, or set
    # OPENCODE_BIN in .env to the local opencode binary. User-facing PRs and
    # comments still present this as CodeZero implementation work.
    mode: cli
    name: codezero-coding-cli
    command: 'OPENCODE_BIN="${OPENCODE_BIN:-opencode}"; "$OPENCODE_BIN" run --agent build --model "$CODEZERO_OPENCODE_MODEL" --variant "${CODEZERO_OPENCODE_VARIANT:-minimal}" --format json "Implement the CodeZero request in the attached prompt file." --file="$CODEZERO_PROMPT_FILE"'
    timeout_ms: 3600000
    env: {}
