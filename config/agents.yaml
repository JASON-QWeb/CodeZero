providers:
  default:
    type: openai-compatible
    base_url: "${OPENAI_BASE_URL}"
    api_key_env: "OPENAI_API_KEY"
    model: "${OPENAI_MODEL}"
    supports_tools: true
    supports_structured_output: true
    timeout_ms: 900000
    # Optional: override only the sandbox coding executor provider/model.
    # mode:
    #   auto   - default; wraps this OpenAI-compatible provider for the executor.
    #   custom - register any custom OpenCode provider config for the executor.
    #   native - use an OpenCode built-in provider/model directly.
    # coding_executor:
    #   mode: native
    #   provider_id: anthropic
    #   model: claude-sonnet-4-5
    #   env:
    #     ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
  # Optional extra providers for cost/quality routing.
  # qwen_fast:
  #   type: openai-compatible
  #   base_url: "${QWEN_BASE_URL}"
  #   api_key_env: "QWEN_API_KEY"
  #   model: "qwen3.5"
  #   supports_tools: true
  #   supports_structured_output: true
  # deepseek_strong:
  #   type: openai-compatible
  #   base_url: "${DEEPSEEK_BASE_URL}"
  #   api_key_env: "DEEPSEEK_API_KEY"
  #   model: "deepseek-v4"
  #   supports_tools: true
  #   supports_structured_output: true

# Domestic OpenAI-compatible examples:
# DeepSeek:
#   OPENAI_BASE_URL=https://api.deepseek.com
#   OPENAI_MODEL=deepseek-v4
# Qwen compatible gateway:
#   OPENAI_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
#   OPENAI_MODEL=qwen3.5

agents:
  prd:
    provider: default
    system_prompt: prompts/system/prd-agent.md
    skills:
      - brainstorm-requirements
      - draft-prd
  search_planner:
    provider: default
    system_prompt: prompts/system/search-planner-agent.md
    skills:
      - agentic-code-search
  implementation:
    provider: default
    # Optional complexity routing after PRD complexity scoring:
    # provider_by_complexity:
    #   low: qwen_fast
    #   medium: default
    #   high: deepseek_strong
    system_prompt: prompts/system/main-agent.md
    skills:
      - repo-context-compress
      - implementation-scope-planner
  review:
    provider: default
    # provider_by_complexity:
    #   high: deepseek_strong
    system_prompt: prompts/system/review-agent.md
    skills:
      - pr-compliance-review
