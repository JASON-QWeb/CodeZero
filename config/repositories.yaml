repositories:
  - id: codezero
    github_owner: JASON-QWeb
    github_repo: CodeZero
    default_branch: main
    project_skill_path: ".agent"
    trigger:
      mode: mention
      mention: "@agent-prd"
      auto_events:
        - issues.opened
        - issues.reopened
      label_allowlist:
        - agent-ready
      label_blocklist:
        - no-agent
        - security-review
    codebase_intelligence:
      # Restore and hash-sync the ignored baseline cache; keep unmerged task edits sandbox-local.
      codegraph:
        enabled: true
        package: "@colbymchenry/codegraph@0.9.3"
        init_args:
          - "--index"
        timeout_ms: 600000
        fail_on_error: true
      navigation_graph:
        enabled: true
        include_git_history: true
        include_codeowners: true
        max_depth: 4
    queue:
      max_concurrent_issues: 2
    workflow:
      require_prd_review: true
    permissions:
      allowed_tools:
        - repo.search
        - repo.read_file
        - codegraph.query
        - codegraph.context
        - repo.apply_patch
        - repo.replace_text
        - repo.write_file
        - shell.run
        - github.create_draft_pr
        - browser.screenshot
        - memory.propose_update
      blocked_tools: []
      allowed_permissions:
        - read
        - safe_write
        - repo_write
        - external_write
      blocked_permissions:
        - dangerous
    quality_gates:
      build: "pnpm install --frozen-lockfile && pnpm build"
      lint: "pnpm lint"
      typecheck: "pnpm typecheck"
      unit_test: "pnpm test"
    frontend:
      dev_command: "pnpm dev:web"
      screenshot_urls:
        - "http://localhost:3000/"
    pr:
      default_draft: true
  - id: beautyskillshub
    github_owner: JASON-QWeb
    github_repo: BeautySkillsHub
    default_branch: main
    project_skill_path: ".agent"
    trigger:
      mode: mention
      mention: "@codeZero"
      auto_events:
        - issues.opened
        - issues.reopened
      label_allowlist:
        - agent-ready
      label_blocklist:
        - no-agent
        - security-review
      actor_allowlist: []
    codebase_intelligence:
      codegraph:
        enabled: true
        package: "@colbymchenry/codegraph@0.9.3"
        init_args:
          - "--index"
        timeout_ms: 600000
        fail_on_error: true
      navigation_graph:
        enabled: true
        include_git_history: true
        include_codeowners: true
        max_depth: 4
    queue:
      max_concurrent_issues: 1
    workflow:
      require_prd_review: true
    permissions:
      allowed_tools:
        - repo.search
        - repo.read_file
        - codegraph.query
        - codegraph.context
        - repo.apply_patch
        - repo.replace_text
        - repo.write_file
        - shell.run
        - github.create_draft_pr
        - browser.screenshot
        - memory.propose_update
      blocked_tools: []
      allowed_permissions:
        - read
        - safe_write
        - repo_write
        - external_write
      blocked_permissions:
        - dangerous
    quality_gates:
      setup: "export DATABASE_URL='postgres://skillhub:skillhub@localhost:5432/skillhub_local?sslmode=disable' REDIS_PORT=6380 REDIS_ADDR=localhost:6380; ./scripts/local.sh db up && ./scripts/local.sh migrate"
      build: "export DATABASE_URL='postgres://skillhub:skillhub@localhost:5432/skillhub_local?sslmode=disable'; cd frontend && npm ci && npm run build && cd ../backend && go test ./..."
      typecheck: "cd frontend && npx tsc -b"
      unit_test: "export DATABASE_URL='postgres://skillhub:skillhub@localhost:5432/skillhub_local?sslmode=disable'; cd frontend && npm run test:node && cd ../backend && go test ./..."
    frontend:
      dev_command: "export DATABASE_URL='postgres://skillhub:skillhub@localhost:5432/skillhub_local?sslmode=disable' REDIS_PORT=6380 REDIS_ADDR=localhost:6380 SEED_LOCAL=0; ./scripts/local.sh dev"
      screenshot_urls:
        - "http://127.0.0.1:5173/"
    pr:
      default_draft: true
