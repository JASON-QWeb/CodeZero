providers:
  default:
    type: openai-compatible
    base_url: "${OPENAI_BASE_URL}"
    api_key_env: "OPENAI_API_KEY"
    model: "${OPENAI_MODEL}"
    supports_structured_output: true
    timeout_ms: 900000
    max_retries: 2
    coding_executor:
      mode: auto

agents:
  prd:
    provider: default
    system_prompt: prompts/system/prd-agent.md
    skills:
      - brainstorm-requirements
      - draft-prd
  search_planner:
    provider: default
    system_prompt: prompts/system/search-planner-agent.md
    skills:
      - agentic-code-search
  implementation:
    provider: default
    system_prompt: prompts/system/main-agent.md
    skills:
      - repo-context-compress
      - implementation-scope-planner
  review:
    provider: default
    system_prompt: prompts/system/review-agent.md
    skills:
      - pr-compliance-review
      - frontend-verification
      - backend-verification

repositories:
  - id: example-web
    github_owner: your-org
    github_repo: your-repo
    default_branch: main
    project_skill_path: ".agent"
    project_rule_path: ".agent/rules"
    trigger:
      mode: mention
      mention: "@agent-prd"
      auto_events:
        - issues.opened
        - issues.reopened
      label_allowlist:
        - agent-ready
      label_blocklist:
        - no-agent
        - security-review
      actor_allowlist: []
    codebase_intelligence:
      codegraph:
        enabled: true
        package: "@colbymchenry/codegraph@0.9.3"
        init_args:
          - "--index"
        timeout_ms: 600000
        fail_on_error: true
      navigation_graph:
        enabled: true
        include_git_history: true
        include_codeowners: true
        max_depth: 4
    queue:
      max_concurrent_issues: 2
    workflow:
      require_prd_review: true
    quality_gates:
      setup: "npm install"
      build: "npm run build"
      lint: "npm run lint"
      typecheck: "npm run typecheck"
      unit_test: "npm test"
    frontend:
      dev_command: "npm run dev"
      screenshot_urls:
        - "http://localhost:3000/"
    pr:
      default_draft: true

sandbox:
  mode: worktree
  image: agent-sandbox-node:latest
  root_dir: "./sandboxes"
  network:
    allow:
      - github.com
      - api.openai.com
      - registry.npmjs.org
      - api.github.com
  filesystem:
    allow_repo_only: true
  docker:
    memory: "4g"
    cpus: 2
    pids_limit: 512
  limits:
    max_runtime_minutes: 90
    max_diff_files: 30
    max_diff_lines: 1200
    max_quality_gate_retries: 6
  implementation_executor:
    mode: cli
    name: codezero-coding-cli
    command: 'OPENCODE_BIN="${OPENCODE_BIN:-opencode}"; "$OPENCODE_BIN" run --agent build --model "$CODEZERO_OPENCODE_MODEL" --variant "${CODEZERO_OPENCODE_VARIANT:-minimal}" --format json --dangerously-skip-permissions "Implement the CodeZero request in the attached prompt file." --file="$CODEZERO_PROMPT_FILE"'
    timeout_ms: 3600000
    env: {}

memory:
  max_records: 500
  max_bytes: 2000000
  max_record_bytes: 16000

workflow_graph:
  checkpoint_file: data/langgraph-checkpoints.json
