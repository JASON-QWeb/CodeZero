sandbox:
  mode: worktree
  image: agent-sandbox-node:latest
  root_dir: "./sandboxes"
  network:
    allow:
      - github.com
      - token-plan-cn.xiaomimimo.com
      - registry.npmjs.org
      - api.github.com
  filesystem:
    allow_repo_only: true
  limits:
    max_runtime_minutes: 90
    max_diff_files: 30
    max_diff_lines: 1200
    max_quality_gate_retries: 6
  implementation_executor:
    mode: cli
    name: codezero-coding-cli
    command: 'npx -y opencode-ai@latest run --agent build --model "$CODEZERO_OPENCODE_MODEL" --format json --dangerously-skip-permissions --file "$CODEZERO_PROMPT_FILE" "Implement the CodeZero request in the attached prompt file."'
    timeout_ms: 3600000
    fallback_to_legacy_json_actions: true
    env: {}
