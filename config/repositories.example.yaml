repositories:
  - id: example-web
    github_owner: your-org
    github_repo: your-repo
    default_branch: main
    project_skill_path: ".agent"
    # Repository-level trigger policy. Use mention for conservative rollout,
    # auto for low-risk internal repos, label for triaged team workflows.
    trigger:
      mode: mention # auto | mention | label | manual | disabled
      mention: "@agent-prd"
      auto_events:
        - issues.opened
        - issues.reopened
      label_allowlist:
        - agent-ready
      label_blocklist:
        - no-agent
        - security-review
    codebase_intelligence:
      navigation_graph:
        enabled: true
        include_git_history: true
        include_codeowners: true
        max_depth: 4
    # Hard cap for compute-heavy issue workflows in this repository.
    # Extra issues stay QUEUED and are retried by the worker.
    queue:
      max_concurrent_issues: 2
    # Repository-level tool boundary. Empty allowlists mean "use global defaults";
    # non-empty allowlists make this repo stricter than the global Tool Gateway policy.
    permissions:
      allowed_tools:
        - repo.search
        - repo.read_file
        - repo.apply_patch
        - shell.run
      blocked_tools: []
      allowed_permissions:
        - read
        - repo_write
        - safe_write
      blocked_permissions:
        - dangerous
    quality_gates:
      build: "npm run build"
      lint: "npm run lint"
      typecheck: "npm run typecheck"
      unit_test: "npm test"
    frontend:
      dev_command: "npm run dev"
      screenshot_urls:
        - "http://localhost:3000/"
    pr:
      default_draft: true
